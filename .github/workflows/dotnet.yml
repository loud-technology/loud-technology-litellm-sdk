name: Build, test, and publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  SOLUTION: Loud.Technology.LiteLLM.Sdk.slnx
  PROJECT: src/libs/LiteLLM/Loud.Technology.LiteLLM.Sdk.csproj

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test "$SOLUTION" --configuration "$CONFIGURATION" --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration "$CONFIGURATION" --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish-github-packages:
    name: Publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Configure loud-technology GitHub Packages source
        shell: bash
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source \
            --username "${GITHUB_ACTOR}" \
            --password "${GITHUB_PACKAGES_TOKEN}" \
            --store-password-in-clear-text \
            --name github-packages \
            "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"

      - name: Publish package
        shell: bash
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          for package in artifacts/*.nupkg; do
            [[ "${package}" == *.snupkg ]] && continue
            dotnet nuget push "${package}" \
              --api-key "${GITHUB_PACKAGES_TOKEN}" \
              --source github-packages \
              --skip-duplicate
          done
